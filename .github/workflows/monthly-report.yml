name: Monthly attendance report

on:
  schedule:
    # 06:00 UTC on the 1st of each month - a few hours after the daily sync
    # so the last day of the previous month is already in the Sheet.
    - cron: '0 6 1 * *'
  workflow_dispatch: {}

permissions:
  contents: write
  id-token: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/294264196664/locations/global/workloadIdentityPools/github-actions-pool/providers/github-provider
          service_account: rugby-sheets-sync@positive-rush-496120-f7.iam.gserviceaccount.com

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate report
        run: python generate_monthly_report.py

      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/
          git diff --cached --quiet || git commit -m "Add monthly attendance report"
          git push
